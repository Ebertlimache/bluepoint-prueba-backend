services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bluepoint
      POSTGRES_PASSWORD: bluepoint
      POSTGRES_DB: inventario
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluepoint -d inventario"]
      interval: 3s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://bluepoint:bluepoint@db:5432/inventario?schema=public
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
